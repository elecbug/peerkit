version: 1
protocol: base_flooding
experiment:
  name: topology-ba-opportunistic
  seed: 42
  duration_ms: 5000
  warmup_ms: 100
deployment:
  mode: compose
domain:
  n: 20
  id_prefix: n
  zero_padding: 2
  topology:
    model: ba-opportunistic
    m: 3
  # Baseline node/link delays participate in opportunistic hub selection.
  node:
    processing_delay_distribution: "normal(mean=50ms, stddev=25ms)"
    processing_delay_jitter_stddev: 10ms
    workers: 1
    queue_capacity: 64
    overflow_policy: drop_new
  edge:
    delay_distribution: "exponential(mean=100ms)"
    delay_jitter_stddev: 30ms
    loss_rate: 0.0
    bandwidth_mbps: 100
    queue_capacity: 32
traffic:
  - source: random
    start_at_ms: 0
    count: 1
    interval_ms: 0
    payload_size_bytes: 256
